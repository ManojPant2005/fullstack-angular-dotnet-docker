version: '3.8'
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong@Pass123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build: ./backend
    ports:
      - "5000:80"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=FullStackDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;

  client:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqlserver_data: